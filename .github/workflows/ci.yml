name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
      - name: Install locked application dependencies
        run: uv sync --locked --no-dev
      - name: Check installed dependencies
        run: uv pip check
      - name: Verify Python, package, and model artifact versions
        run: uv run python scripts/check_environment.py
      - name: Exercise synthetic training workflow
        run: uv run python scripts/synthetic_training_smoke.py
      - name: Compile application and tests
        run: uv run python -m compileall -q app tests scripts
      - name: Run tests
        run: uv run python -m unittest discover -s tests -v
